name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publikacja APK w wydaniu "najnowsza"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy logiki i kompilacja klienta
        run: ./gradlew :shared:test :server:test :core:build :desktop:build --console=plain
      - name: Budowa APK (debug)
        run: ./gradlew :android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-debug-apk
          path: android/build/outputs/apk/debug/*.apk
      # APK do pobrania z telefonu: github.com/fawizja/Pixel/releases/tag/najnowsza (zawsze ostatni commit na main)
      - name: Publikacja APK (wydanie "najnowsza")
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/outputs/apk/debug/*.apk Pixel-offline.apk
          git tag -f najnowsza
          git push -f origin najnowsza
          gh release view najnowsza >/dev/null 2>&1 || gh release create najnowsza --prerelease \
            --title "Pixel - najnowsza wersja (offline)" \
            --notes "APK (debug) z ostatniego commita na main. Nowa postac offline startuje na poziomie 300. Przed instalacja nowszej wersji odinstaluj poprzednia (kazda kompilacja ma inny klucz debug)."
          gh release upload najnowsza Pixel-offline.apk --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: shared/build/reports/tests/test

  gui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ekran wirtualny
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri
      - name: Regresja GUI (zrzuty ekranu porownane z wzorcami)
        run: |
          ./gradlew :desktop:installDist --console=plain
          xvfb-run -a -s "-screen 0 1280x720x24" tools/gui-regression/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-regression
          path: build/gui-regression

  android-smoke:
    # APK z zadania build uruchomiony na emulatorze: start bez awarii i pomiar klatek z logcat.
    # Emulator renderuje programowo (SwiftShader), wiec FPS nie odpowiada telefonowi - liczy sie brak awarii i trend.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pixel-debug-apk
          path: apk
      - name: KVM dla emulatora
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator - start gry i pomiar klatek
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/android-smoke/run.sh apk build/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: build/android-smoke

  server-image:
    # Obraz Docker serwera: budowa, start i sprawdzenie, ze serwer nasluchuje z TLS (bez publikacji obrazu).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Budowa serwera i obrazu
        run: |
          ./gradlew :server:installDist --console=plain
          docker build -f server/Dockerfile -t pixel-server .
      - name: Start kontenera i sprawdzenie TLS
        run: |
          docker run -d --name pixel -p 7171:7171 -v pixel-data:/data pixel-server
          for i in $(seq 1 60); do
            if docker logs pixel 2>&1 | grep -q "listening on port 7171 (TLS"; then break; fi
            sleep 1
          done
          docker logs pixel 2>&1 | tail -20
          docker logs pixel 2>&1 | grep -q "listening on port 7171 (TLS"
          echo | timeout 10 openssl s_client -connect 127.0.0.1:7171 2>/dev/null | grep -q "BEGIN CERTIFICATE"
          docker restart pixel
          sleep 8
          docker logs pixel 2>&1 | grep -c "listening on port 7171 (TLS" | grep -qx 2
          docker logs pixel 2>&1 | grep -c "Utworzono certyfikat" | grep -qx 1
          echo "OK: serwer w kontenerze dziala, certyfikat przetrwal restart (wolumen /data)"
