name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy logiki i kompilacja klienta
        run: ./gradlew :shared:test :server:test :core:build :desktop:build --console=plain
      - name: Budowa APK (debug)
        run: ./gradlew :android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-debug-apk
          path: android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: shared/build/reports/tests/test
