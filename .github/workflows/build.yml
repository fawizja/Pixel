name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy logiki i kompilacja klienta
        run: ./gradlew :shared:test :server:test :core:build :desktop:build --console=plain
      - name: Budowa APK (debug)
        run: ./gradlew :android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-debug-apk
          path: android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: shared/build/reports/tests/test

  gui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ekran wirtualny
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri
      - name: Regresja GUI (zrzuty ekranu porownane z wzorcami)
        run: |
          ./gradlew :desktop:installDist --console=plain
          xvfb-run -a -s "-screen 0 1280x720x24" tools/gui-regression/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-regression
          path: build/gui-regression

  android-smoke:
    # APK z zadania build uruchomiony na emulatorze: start bez awarii i pomiar klatek z logcat.
    # Emulator renderuje programowo (SwiftShader), wiec FPS nie odpowiada telefonowi - liczy sie brak awarii i trend.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pixel-debug-apk
          path: apk
      - name: KVM dla emulatora
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator - start gry i pomiar klatek
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/android-smoke/run.sh apk build/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: build/android-smoke
