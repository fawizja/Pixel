allprojects {
    group = 'pl.fawizja.pixel'
    version = '0.1.0'

    ext {
        gdxVersion = '1.13.5'
        junitVersion = '5.11.4'
    }

    repositories {
        mavenCentral()
        google()
    }
}

configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
        options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Testy mechaniki licza od poziomu 8 bez zlota w banku; gra startuje od 300 z 10 mln gp
        // (data/starting.properties, sprawdza StartingConfigFileTest).
        systemProperty 'pixel.start.level', '8'
        systemProperty 'pixel.start.gold.bank', '0'
        // swiat 1000x1000: kazdy test serwera laduje caly swiat (ok. 15 MB), domyslne 512 MB nie wystarcza
        maxHeapSize = '1536m'
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }
}
